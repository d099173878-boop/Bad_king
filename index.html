<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAD_KING | در حال انتقال...</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* گرادیانت پس‌زمینه مشابه سایت */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 200, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ذرات شناور */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffc8;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ffc8, 0 0 12px #00ffc8;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 60px 50px;
            max-width: 600px;
            width: 90%;
            background: linear-gradient(145deg, rgba(15, 15, 25, 0.9), rgba(10, 10, 15, 0.95));
            border: 1px solid rgba(0, 255, 200, 0.2);
            border-radius: 24px;
            box-shadow: 
                0 0 40px rgba(0, 255, 200, 0.1),
                0 0 80px rgba(168, 85, 247, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* لوگو دایره‌ای با حلقه نئون */
        .logo-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
        }
        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00ffc8, #a855f7, #00ffc8);
            padding: 3px;
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        .logo-inner {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        /* فال‌بک اگه عکس لود نشد */
        .logo-fallback {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffc8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        /* نیم دایره‌های تزئینی */
        .ring-decoration {
            position: absolute;
            inset: -15px;
            border: 1px dashed rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            animation: rotate 15s linear infinite reverse;
        }
        .ring-decoration::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #00ffc8;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffc8, 0 0 20px #00ffc8;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00ffc8 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .username {
            font-size: 1.3rem;
            color: #00ffc8;
            font-weight: 700;
            margin-bottom: 25px;
            direction: ltr;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
            letter-spacing: 2px;
        }
        .username::before,
        .username::after {
            content: '◆';
            margin: 0 12px;
            font-size: 0.7em;
            opacity: 0.7;
        }

        /* پیام اصلی */
        .message {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .message .highlight {
            color: #00ffc8;
            font-weight: 700;
            direction: ltr;
            display: inline-block;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }

        /* بج‌های کوچک مشابه سایت */
        .badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .badge {
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            border-radius: 50px;
            font-size: 0.75rem;
            color: #00ffc8;
            background: rgba(0, 255, 200, 0.05);
            direction: ltr;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .badge.purple {
            border-color: rgba(168, 85, 247, 0.4);
            color: #c084fc;
            background: rgba(168, 85, 247, 0.08);
        }

        /* شمارش معکوس بزرگ */
        .countdown-box {
            margin: 30px 0;
        }
        .countdown-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .countdown {
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffc8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            filter: drop-shadow(0 0 25px rgba(0, 255, 200, 0.5));
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* نوار پیشرفت */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin: 25px 0;
            border: 1px solid rgba(0, 255, 200, 0.15);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffc8, #a855f7);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.8);
            transition: width 1s linear;
        }

        /* دکمه‌ها مشابه سایت */
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .btn {
            padding: 12px 26px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        .btn-ghost {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 255, 200, 0.4);
        }
        .btn-primary {
            background: linear-gradient(135deg, #00ffc8, #a855f7);
            color: #0a0a0f;
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 0 35px rgba(0, 255, 200, 0.7);
            transform: translateY(-2px);
        }

        /* خط تزئینی بالا و پایین */
        .top-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ffc8, transparent);
            box-shadow: 0 0 10px #00ffc8;
        }

        @media (max-width: 480px) {
            .container { padding: 40px 25px; }
            h1 { font-size: 1.4rem; }
            .username { font-size: 1.1rem; }
            .countdown { font-size: 4rem; }
            .logo-wrap { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>
    <!-- ذرات شناور -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="top-line"></div>

        <!-- لوگو -->
        <div class="logo-wrap">
            <div class="ring-decoration"></div>
            <div class="logo-ring">
                <div class="logo-inner">
                    <!-- اگه لوگو داری، آدرسش رو اینجا بذار -->
                    <img src="https://badking.ir/logo.png" alt="BAD_KING" 
                         onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'logo-fallback\'>BK</div>';">
                </div>
            </div>
        </div>

        <h1>وب جدید ما رونمایی شد!</h1>
        <div class="username">BAD_KING</div>

        <p class="message">
            در حال انتقال به سایت جدید<br>
            <span class="highlight">badking.ir</span>
        </p>

        <!-- بج‌ها -->
        <div class="badges">
            <span class="badge">✦ AI EXPERT</span>
            <span class="badge purple">✦ CREATIVE MIND</span>
            <span class="badge">✦ SYSTEM: ONLINE</span>
        </div>

        <!-- شمارش معکوس -->
        <div class="countdown-box">
            <div class="countdown-label">// انتقال خودکار در</div>
            <div class="countdown" id="countdown">3</div>
        </div>

        <!-- نوار پیشرفت -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <!-- دکمه‌ها -->
        <div class="buttons">
            <a href="https://badking.ir" class="btn btn-primary">
                🚀 ورود به سایت جدید
            </a>
        </div>
    </div>

    <script>
        // ===== شمارش معکوس =====
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        const progressEl = document.getElementById('progress');

        setTimeout(() => progressEl.style.width = '33%', 100);

        const timer = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                countdownEl.textContent = seconds;
                progressEl.style.width = ((3 - seconds) / 3 * 100) + '%';
            } else {
                countdownEl.textContent = '0';
                progressEl.style.width = '100%';
                clearInterval(timer);
            }
        }, 1000);

        // انتقال بعد از 3 ثانیه
        setTimeout(() => {
            window.location.href = 'https://badking.ir';
        }, 3000);

        // ===== ذرات شناور =====
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 8 + 6) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.opacity = Math.random() * 0.5 + 0.3;
            if (Math.random() > 0.7) {
                p.style.background = '#a855f7';
                p.style.boxShadow = '0 0 6px #a855f7, 0 0 12px #a855f7';
            }
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
