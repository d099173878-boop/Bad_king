<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال انتقال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* افکت پس‌زمینه با گرادیانت و نور */
        .bg-effect {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 70, 70, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(255, 70, 70, 0.03) 0%, transparent 50%),
                #0a0a0a;
            z-index: 0;
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2.5rem 3rem;
            max-width: 90%;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* لوگوی شما - با placeholder */
        .logo-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(255, 70, 70, 0.05);
            transition: all 0.3s ease;
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 70, 70, 0.05); }
            50% { box-shadow: 0 0 60px rgba(255, 70, 70, 0.12); }
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* جایگزین برای لوگو - اگر تصویر لود نشد */
        .logo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a, #2a1a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ff4444;
            letter-spacing: 2px;
        }

        .title {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .title span {
            color: #ff4444;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            font-weight: 300;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* نوار پیشرفت با تم قرمز */
        .progress-section {
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4444, #ff6b6b, #ff4444);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: progressAnim 3s ease-in-out forwards, shimmer 1.2s linear infinite;
        }

        @keyframes progressAnim {
            0% { width: 0%; }
            25% { width: 30%; }
            60% { width: 68%; }
            85% { width: 85%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        .progress-text .percent {
            color: rgba(255, 68, 68, 0.4);
            font-weight: 600;
        }

        /* دکمه‌ی کوچک (فقط برای زیبایی) */
        .hint {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.03);
            font-size: 0.5rem;
            letter-spacing: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }
            .logo-wrapper {
                width: 80px;
                height: 80px;
            }
            .title {
                font-size: 1.3rem;
            }
            .progress-section {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-effect"></div>

    <div class="container">
        <div class="logo-wrapper">
            <img 
                src="https://cdn.imgurl.ir/uploads/d89292_ChatGPT_Image_Jun_21_2026_09_44_35_PM.png" 
                alt="لوگو"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <div class="logo-placeholder" style="display:none;">
                <span>●</span>
            </div>
        </div>

        <h1 class="title">
            در حال انتقال به <span>BAD KING</span>
        </h1>
        <p class="subtitle">لطفاً چند لحظه صبر کنید</p>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span>در حال آماده‌سازی</span>
                <span class="percent" id="progressText">۰%</span>
            </div>
        </div>

        <div class="hint">✦ ✦ ✦</div>
    </div>

    <script>
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        let startTime = Date.now();
        const duration = 3000;

        function updateProgress() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min((elapsed / duration) * 100, 100);
            progressText.textContent = Math.floor(progress) + '%';
            
            if (progress < 100) {
                requestAnimationFrame(updateProgress);
            }
        }
        updateProgress();

        // انتقال با افکت
        setTimeout(() => {
            const container = document.querySelector('.container');
            container.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.92)';
            
            // محو کردن پس‌زمینه
            document.querySelector('.bg-effect').style.transition = 'opacity 0.6s ease';
            document.querySelector('.bg-effect').style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = "https://d099173878-boop.github.io/bad-king-page/";
            }, 600);
        }, 3000);
    </script>
</body>
</html>
